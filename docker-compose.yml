version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: viralfabrics-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_SITE_URL=https://viralfabrics.com
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    resources:
      limits:
        cpus: '1.0'
        memory: 1024M
      reservations:
        memory: 256M

